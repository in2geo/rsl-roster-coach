<title>Spider's Den 13 — Simulator Replay</title>
<style>
  :root{
    --bg:#081317; --panel:#0e1f26; --panel2:#143039; --line:#1d3d47;
    --ink:#dde9ec; --muted:#7c9aa2; --dim:#557079;
    --accent:#33c9d0; --gold:#e7b551;
    --hp:#e0564d; --hp-mid:#e0a84e; --hp-hi:#54c268;
    --shield:#58a6e6; --heal:#56c778; --slow:#c489e6; --boss:#d9564f;
    --font-ui:"Trebuchet MS",ui-sans-serif,system-ui,sans-serif;
    --font-num:ui-monospace,"SF Mono","Cascadia Mono","Consolas",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0}
  .wrap{
    max-width:940px;margin:0 auto;padding:20px 18px 30px;
    background:
      radial-gradient(1200px 380px at 50% -120px,rgba(51,201,208,.10),transparent 70%),
      linear-gradient(180deg,#0a171c,#06100f);
    color:var(--ink);font-family:var(--font-ui);min-height:100vh;
  }
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* header */
  .hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .hud h1{font-size:17px;margin:0;letter-spacing:.02em;font-weight:700}
  .hud h1 span{color:var(--accent)}
  .badge{margin-left:auto;display:flex;align-items:center;gap:10px}
  .result{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px;
    padding:5px 12px;border-radius:4px;border:1px solid}
  .result.win{color:var(--gold);border-color:rgba(231,181,81,.5);background:rgba(231,181,81,.08)}
  .result.loss{color:var(--hp);border-color:rgba(224,86,77,.5);background:rgba(224,86,77,.08)}
  .turnpill{display:flex;align-items:baseline;gap:7px;font-family:var(--font-num);
    padding:6px 14px;border:1px solid rgba(51,201,208,.4);border-radius:6px;background:rgba(51,201,208,.08)}
  .turnpill .k{font-family:var(--font-ui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .turnpill b{color:var(--accent);font-size:22px;font-weight:800;line-height:1}
  .turnpill .tot{font-size:14px;color:var(--muted)}

  /* boss */
  .boss{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;overflow:hidden}
  .boss.acting{border-color:rgba(217,86,79,.75);box-shadow:0 0 0 1px rgba(217,86,79,.35),0 0 26px rgba(217,86,79,.22)}
  .boss .top{display:flex;align-items:baseline;gap:12px;margin-bottom:9px}
  .boss .name{font-weight:800;letter-spacing:.03em;font-size:16px;color:#f0dcae}
  .boss .atk{margin-left:auto;font-family:var(--font-num);font-size:12px;color:var(--muted)}
  .boss .atk b{color:var(--hp-mid)}
  .bar{position:relative;height:20px;border-radius:4px;background:#08171c;
    border:1px solid var(--line);overflow:hidden}
  .bar > i{position:absolute;inset:0;transform-origin:left;transition:transform .25s ease}
  .bar .fill-boss{background:linear-gradient(90deg,#b23a34,#e0564d)}
  .bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-num);font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
  .tmrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .tmbar{flex:1;height:6px;border-radius:3px;background:#08171c;border:1px solid var(--line);overflow:hidden}
  .tmbar > i{display:block;height:100%;background:linear-gradient(90deg,#2a8f95,var(--accent));transition:width .25s}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;min-height:20px}
  .chip{font-size:10px;letter-spacing:.03em;padding:2px 7px;border-radius:3px;
    background:rgba(224,86,77,.14);color:#f0a49e;border:1px solid rgba(224,86,77,.3)}
  .chip.buff{background:rgba(86,166,230,.14);color:#a9d0f2;border-color:rgba(86,166,230,.3)}
  .chip.slow{background:rgba(196,137,230,.16);color:#dcb6f2;border-color:rgba(196,137,230,.35)}
  .consume{position:absolute;top:10px;right:14px;font-weight:800;letter-spacing:.1em;font-size:12px;
    color:var(--gold);opacity:0;transform:translateY(-4px);pointer-events:none}
  .consume.show{animation:pop 1.1s ease}
  @keyframes pop{0%{opacity:0;transform:translateY(-4px) scale(.9)}18%{opacity:1;transform:translateY(0) scale(1.05)}100%{opacity:0;transform:translateY(-2px)}}

  /* swarm */
  .swarm{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:9px 14px;margin-bottom:12px}
  .swarm.acting{border-color:rgba(51,201,208,.5)}
  .pips{display:flex;gap:5px}
  .pip{width:15px;height:15px;border-radius:50%;background:#0c2027;border:1px solid var(--line);position:relative}
  .pip.alive{background:radial-gradient(circle at 35% 30%,#7a4a52,#3a1d22);border-color:#5a2d34}
  .pip.slow{box-shadow:0 0 0 2px rgba(196,137,230,.7);border-color:var(--slow)}
  .swarm .rd{font-family:var(--font-num);font-size:12px;color:var(--muted)}
  .swarm .rd b{color:var(--ink)}
  .swarm .rd .sl{color:var(--slow)}

  /* team */
  .team{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
  @media(max-width:640px){.team{grid-template-columns:repeat(2,1fr)}}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:8px;padding:10px;position:relative;transition:border-color .2s,box-shadow .2s}
  .card.acting{border-color:rgba(51,201,208,.8);box-shadow:0 0 0 1px rgba(51,201,208,.4),0 0 20px rgba(51,201,208,.18)}
  .card.dead{opacity:.42;filter:grayscale(.7)}
  .card .cn{font-weight:700;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
  .card .cn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .card.acting .cn .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .hpwrap{margin-top:8px}
  .hpbar{position:relative;height:15px;border-radius:3px;background:#08171c;border:1px solid var(--line);overflow:hidden}
  .hpbar > .hp{position:absolute;inset:0;transform-origin:left;transition:transform .25s ease,background .25s}
  .hpbar > .sh{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,rgba(88,166,230,.55),rgba(88,166,230,.55) 4px,rgba(88,166,230,.3) 4px,rgba(88,166,230,.3) 8px);border-left:1px solid #7ec0ff}
  .hpnum{font-family:var(--font-num);font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .hpnum .taken{color:var(--dim)}
  .delta{position:absolute;right:6px;top:-2px;font-family:var(--font-num);font-size:12px;font-weight:700;
    opacity:0;pointer-events:none}
  .delta.dmg{color:var(--hp)}.delta.heal{color:var(--heal)}
  .delta.show{animation:float 1s ease}
  @keyframes float{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  .ministat{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;min-height:16px}
  .mini{font-size:9px;letter-spacing:.02em;padding:1px 5px;border-radius:3px;line-height:1.5}
  .mini.taunt{background:rgba(231,181,81,.16);color:var(--gold);border:1px solid rgba(231,181,81,.3)}
  .mini.veil{background:rgba(51,201,208,.14);color:var(--accent);border:1px solid rgba(51,201,208,.3)}
  .mini.shield{background:rgba(88,166,230,.14);color:#a9d0f2;border:1px solid rgba(88,166,230,.3)}
  .mini.cc{background:rgba(224,86,77,.14);color:#f0a49e;border:1px solid rgba(224,86,77,.3)}
  .dead-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;letter-spacing:.2em;font-size:12px;color:var(--hp);text-transform:uppercase}

  /* event line */
  .event{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    margin-bottom:14px;font-family:var(--font-num);font-size:13px;display:flex;align-items:center;gap:10px;min-height:40px}
  .event .who{font-weight:700}
  .event .who.ally{color:var(--accent)}.event .who.boss{color:var(--boss)}.event .who.add{color:#c98}
  .event .arrow{color:var(--dim)}
  .event .sk{color:var(--ink)}
  .event .hit{margin-left:auto;color:var(--hp-mid)}

  /* transport */
  .transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  button{font-family:var(--font-ui);font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.play{background:var(--accent);color:#04181b;font-weight:800;border-color:var(--accent);min-width:74px}
  button.play:hover{filter:brightness(1.1)}
  .spd{display:flex;gap:4px}
  .spd button{padding:6px 9px;font-family:var(--font-num);font-size:12px}
  .spd button.on{background:rgba(51,201,208,.18);border-color:var(--accent);color:#fff}
  .scrub{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
  input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
  .scrub .tc{font-family:var(--font-num);font-size:13px;color:var(--ink);white-space:nowrap;min-width:96px;text-align:right}
  .scrub .tc b{color:var(--accent);font-weight:800}
  .legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="hud">
    <h1>Spider's Den 13 · <span>Simulator Replay</span></h1>
    <div class="badge">
      <span class="lbl" id="seedlbl"></span>
      <span class="result" id="result"></span>
      <span class="turnpill"><span class="k">Turn</span><b id="tnow">1</b><span class="tot">/ <span id="ttot">0</span></span></span>
    </div>
  </div>

  <div class="boss" id="bossPanel">
    <div class="top">
      <span class="name">Skavag the Spider Queen</span>
      <span class="atk">ATK <b id="bossAtk">×1.0</b></span>
    </div>
    <div class="bar"><i class="fill-boss" id="bossHpFill"></i><span class="txt num" id="bossHpTxt"></span></div>
    <div class="tmrow"><span class="lbl">Turn&nbsp;Meter</span><div class="tmbar"><i id="bossTm"></i></div></div>
    <div class="chips" id="bossChips"></div>
    <div class="consume" id="consume"></div>
  </div>

  <div class="swarm" id="swarmPanel">
    <span class="lbl">Swarm</span>
    <div class="pips" id="pips"></div>
    <span class="rd"><b id="swAlive">0</b>/10 alive · <span class="sl"><b id="swSlow">0</b> slowed</span></span>
  </div>

  <div class="team" id="team"></div>

  <div class="event" id="eventLine"></div>

  <div class="transport">
    <button class="play" id="playBtn">▶ Play</button>
    <button id="stepB" title="Step back">⏮</button>
    <button id="stepF" title="Step forward">⏭</button>
    <button id="restart" title="Restart">↺</button>
    <div class="spd" id="spd">
      <button data-s="900">0.5×</button><button data-s="450" class="on">1×</button>
      <button data-s="220">2×</button><button data-s="90">4×</button>
    </div>
    <div class="scrub"><input type="range" id="range" min="0" value="0"><span class="tc" id="tc">Turn <b>1</b></span></div>
  </div>

  <div class="legend">
    <span><i class="sw" style="background:#e0564d"></i>HP</span>
    <span><i class="sw" style="background:#58a6e6"></i>Shield</span>
    <span><i class="sw" style="background:#c489e6"></i>Slowed spiderling</span>
    <span><i class="sw" style="background:#e7b551"></i>Taunt / Consume</span>
    <span><i class="sw" style="background:#33c9d0"></i>Acting now</span>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('battledata').textContent);
const F = DATA.frames, M = DATA.meta;
const CC = ['Sleep','Stun','Freeze','Petrification','Provoke','Fear'];
let i = 0, timer = null, speed = 450;

// static header
document.getElementById('seedlbl').textContent = 'seed ' + M.seed;
document.getElementById('ttot').textContent = M.turns;
const rz = document.getElementById('result');
rz.textContent = M.result; rz.className = 'result ' + (M.result === 'VICTORY' ? 'win' : 'loss');
document.getElementById('range').max = F.length - 1;

// build team cards once
const teamEl = document.getElementById('team');
M.allies.forEach((a, idx) => {
  const c = document.createElement('div'); c.className = 'card'; c.id = 'card' + idx;
  c.innerHTML =
    '<div class="cn"><span class="dot"></span>' + a.name + '</div>' +
    '<div class="hpwrap"><div class="hpbar"><i class="hp"></i><i class="sh"></i></div>' +
    '<span class="delta"></span>' +
    '<div class="hpnum"><span class="cur"></span><span class="taken"></span></div></div>' +
    '<div class="ministat"></div>' +
    '<div class="dead-tag" style="display:none">Dead</div>';
  teamEl.appendChild(c);
});
// pips
const pipsEl = document.getElementById('pips');
for (let p = 0; p < 10; p++){ const d = document.createElement('div'); d.className = 'pip'; pipsEl.appendChild(d); }
const pips = [...pipsEl.children];

const hpColor = pct => pct > .5 ? 'var(--hp-hi)' : pct > .25 ? 'var(--hp-mid)' : 'var(--hp)';
const kfmt = n => n >= 1000 ? (n/1000).toFixed(n>=100000?0:1)+'k' : String(n);

function render(showFx){
  const f = F[i], prev = i>0 ? F[i-1] : null;
  document.getElementById('tnow').textContent = f.t;
  document.getElementById('tc').innerHTML = 'Turn <b>'+f.t+'</b>';
  document.getElementById('range').value = i;

  // boss
  const bp = f.boss.hp / f.boss.maxHp;
  document.getElementById('bossHpFill').style.transform = 'scaleX('+bp+')';
  document.getElementById('bossHpTxt').textContent = kfmt(f.boss.hp)+' / '+kfmt(f.boss.maxHp)+'  ('+Math.round(bp*100)+'%)';
  document.getElementById('bossTm').style.width = Math.min(100, f.boss.tm)+'%';
  const atk0 = F[0].boss.atk || f.boss.atk;
  document.getElementById('bossAtk').textContent = '×'+(f.boss.atk/atk0).toFixed(1);
  const bc = document.getElementById('bossChips'); bc.innerHTML='';
  f.boss.debuffs.forEach(d=>{ const s=document.createElement('span'); s.className='chip'; s.textContent=d; bc.appendChild(s); });
  document.getElementById('bossPanel').classList.toggle('acting', f.isBoss);

  // consume flash
  const cs = document.getElementById('consume');
  if (showFx && f.consume){ cs.textContent = '⟳ '+f.consume+' · heal +'+(parseInt(f.consume.split(' ')[1]||0)*3)+'%'; cs.classList.remove('show'); void cs.offsetWidth; cs.classList.add('show'); }

  // swarm
  document.getElementById('swAlive').textContent = f.swarm.alive;
  document.getElementById('swSlow').textContent = f.swarm.slowed;
  pips.forEach((p,idx)=>{ p.className='pip'+(idx<f.swarm.alive?' alive':'')+(idx<f.swarm.slowed?' slow':''); });
  document.getElementById('swarmPanel').classList.toggle('acting', f.isAdd);

  // team
  f.allies.forEach((a,idx)=>{
    const card = document.getElementById('card'+idx);
    const pct = a.maxHp ? a.hp/a.maxHp : 0;
    const hp = card.querySelector('.hp');
    hp.style.transform='scaleX('+pct+')'; hp.style.background=hpColor(pct);
    const shPct = a.maxHp ? Math.min(1,(a.shield||0)/a.maxHp) : 0;
    card.querySelector('.sh').style.width=(shPct*100)+'%';
    card.querySelector('.cur').textContent = kfmt(a.hp)+' / '+kfmt(a.maxHp);
    const taken = M.allies[idx];
    card.querySelector('.taken').textContent = Math.round(pct*100)+'%';
    card.classList.toggle('acting', f.side==='ally' && f.actor===a.name);
    card.classList.toggle('dead', !a.alive);
    card.querySelector('.dead-tag').style.display = a.alive?'none':'flex';
    // mini chips: key states
    const ms = card.querySelector('.ministat'); ms.innerHTML='';
    const add=(t,cls)=>{ const s=document.createElement('span'); s.className='mini '+cls; s.textContent=t; ms.appendChild(s); };
    if (a.buffs.includes('Taunt')||a.buffs.includes('Provoke')) add('Taunt','taunt');
    if (a.buffs.includes('Perfect Veil')) add('Veil','veil');
    if ((a.shield||0)>0 || a.buffs.some(b=>/Shield/.test(b))) add('Shield','shield');
    const cc = a.debuffs.find(d=>CC.includes(d)); if (cc) add(cc,'cc');
    // damage/heal delta vs prev
    if (showFx && prev){
      const pa = prev.allies[idx]; const dv = a.hp - pa.hp;
      const de = card.querySelector('.delta');
      if (Math.abs(dv) >= 200 && a.alive && pa.alive){
        de.textContent = (dv>0?'+':'−')+kfmt(Math.abs(dv));
        de.className='delta '+(dv>0?'heal':'dmg'); void de.offsetWidth; de.classList.add('show');
      }
    }
  });

  // event line
  const el = document.getElementById('eventLine');
  const cls = f.isBoss?'boss':(f.isAdd?'add':'ally');
  let html = '<span class="who '+cls+'">'+f.actor+'</span>';
  if (f.side==='ally'){ html += '<span class="arrow">▸</span><span class="sk">'+f.skill+'</span>'; }
  else if (f.isBoss){ html += '<span class="arrow">▸</span><span class="sk">'+(f.consume?('consumes '+f.swarm.alive+' → ATK ×'+(f.boss.atk/atk0).toFixed(1)):'AoE attack')+'</span>'; }
  else { html += '<span class="arrow">▸</span><span class="sk">attacks the team</span>'; }
  if (f.dmgToBoss>0 && f.side==='ally') html += '<span class="hit">−'+kfmt(f.dmgToBoss)+' to boss</span>';
  el.innerHTML = html;
}

function step(n){ i=Math.max(0,Math.min(F.length-1,i+n)); render(true); if(i>=F.length-1) stop(); }
function play(){ if(timer) return; if(i>=F.length-1) i=0; timer=setInterval(()=>step(1),speed); document.getElementById('playBtn').textContent='❚❚ Pause'; }
function stop(){ clearInterval(timer); timer=null; document.getElementById('playBtn').textContent='▶ Play'; }
function toggle(){ timer?stop():play(); }

document.getElementById('playBtn').onclick=toggle;
document.getElementById('stepF').onclick=()=>{stop();step(1);};
document.getElementById('stepB').onclick=()=>{stop();step(-1);};
document.getElementById('restart').onclick=()=>{stop();i=0;render(false);};
document.getElementById('range').oninput=e=>{stop();i=+e.target.value;render(false);};
document.getElementById('spd').onclick=e=>{ const b=e.target.closest('button'); if(!b)return;
  [...document.querySelectorAll('#spd button')].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  speed=+b.dataset.s; if(timer){stop();play();} };
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.code==='ArrowRight'){stop();step(1);} else if(e.code==='ArrowLeft'){stop();step(-1);} });

render(false);
</script>
